[workspace]
name = "rsx-rs"
version = "0.2.6"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
rust = ">=1.85"

[feature.dev.tasks]
check = { cmd = "cargo fmt --check && cargo clippy -- -D warnings && cargo nextest run -p rsxcore --profile ci" }
build = { cmd = "RUSTFLAGS='-C target-cpu=native' cargo build --release" }
build-portable = { cmd = "cargo build --release" }
test = { cmd = "cargo nextest run -p rsxcore" }
test-all = { cmd = "cargo nextest run", description = "Workspace nextest (all members)" }
gen-header = { cmd = "cargo build --manifest-path rsxcore/Cargo.toml --features gen-header" }
# Build/install the C library + cbindgen header + pkg-config via cargo-c.
capi-build = { cmd = "cargo cbuild --release --no-default-features --features parallel --manifest-path rsxcore/Cargo.toml" }
capi-install = { cmd = "cargo cinstall --release --no-default-features --features parallel --manifest-path rsxcore/Cargo.toml --prefix $CONDA_PREFIX" }
bench = { cmd = "RUSTFLAGS='-C target-cpu=native' cargo bench --manifest-path rsxcore/Cargo.toml" }

[feature.dev.dependencies]
cargo-nextest = "*"
cargo-c = "*"
compilers = ">=1.8"
pkg-config = "*"
zlib = "*"

[feature.dev.activation.env]
# Avoid mold linker injected by some conda-forge compiler activation inside pixi dev env
# (causes "ld: cannot find -fuse-ld=mold" or similar when cargo invokes the conda cc).
# Use default system linker for cargo steps; native cpu opt is in the task commands.
RUSTFLAGS = ""

[feature.docs]
platforms = ["linux-64"]

[feature.docs.dependencies]
python = ">=3.11"
pip = "*"
emacs = "*"
sphinx = ">=7,<9"
pandoc = ">=3.1,<4"
doxygen = ">=1.13.2,<2"
doxyrest = ">=2.1.2,<3"

[feature.docs.activation.env]
RUSTFLAGS = ""

[feature.docs.pypi-dependencies]
shibuya = ">=2026.1.9, <2027"
sphinxcontrib-rust = ">=1.0.0, <2"
sphinx-rustdoc-postprocess = ">=0.1.0, <0.2"
sphinx-click = ">=6.0"
sphinx-design = "*"
sphinx-copybutton = "*"
sphinx-tabs = "*"
sphinxcontrib-bibtex = ">=2.6, <3"

[feature.docs.tasks]
setup-doxyrest = { cmd = "test -d subprojects/doxyrest || (mkdir -p subprojects && git clone --depth 1 --single-branch https://github.com/vovkos/doxyrest subprojects/doxyrest)", description = "Clone doxyrest sphinx dependency" }
patch-doxyrest = { cmd = "cp scripts/patches/doxyrest/doxyrest.py subprojects/doxyrest/sphinx/doxyrest.py && cp scripts/patches/doxyrest/doxyrest-shibuya.css subprojects/doxyrest/sphinx/css/doxyrest-shibuya.css && cp scripts/patches/doxyrest/doxyrest-pygments.css subprojects/doxyrest/sphinx/css/doxyrest-pygments.css && patch -p1 -N -s < scripts/patches/doxyrest/enum_class_fix.patch || true", depends-on = ["setup-doxyrest"], description = "Patch doxyrest sphinx extension" }
doxybuild = { cmd = "doxygen Doxyfile_rsx.cfg && doxyrest -c doxyrest-config.lua && python ../../docs/scripts/fix_doxyrest_rst.py", cwd = "docs/source", depends-on = ["patch-doxyrest", "gen-c-header"], description = "Generate C API docs via Doxygen and Doxyrest (post-fix RST)" }
setup-rustdocgen = { cmd = "cargo install sphinx-rustdocgen --root \"$CONDA_PREFIX\"", description = "Install sphinx-rustdocgen for Rust API docs" }
gen-c-header = { cmd = "cargo build --manifest-path rsxcore/Cargo.toml --features gen-header", description = "Generate cbindgen C header (rsxcore/include/rsx.h) so it is available for literalinclude in the docs" }
gen-rust-api = { cmd = "rm -rf docs/source/crates/rsx_core || true; sphinx-rustdocgen '{\"crate_name\":\"rsx_core\",\"crate_dir\":\"rsxcore\",\"doc_dir\":\"docs/source/crates\",\"force\":true,\"strip_src\":true}'", depends-on = ["setup-rustdocgen"], description = "Generate Rust API docs into docs/source/crates/rsx_core/." }
mkrst = { cmd = "emacs --batch --load docs/export.el", description = "Export orgmode docs to RST (canonical narrative source: docs/orgmode/)" }
fix-doc-links = { cmd = "python docs/scripts/fix_doc_links.py", depends-on = ["mkrst"], description = "Rewrite accidental .rst/.org hyperlinks to :doc: roles (readcon-core pattern)" }
# Full docs pipeline (CI + local). Prefer `pixi run -e docs docbld` or `site` — same task.
site = { cmd = "mkdir -p docs/source/_static && rm -rf docs/build/reference/architecture.html docs/build/reference/benchmarks.html docs/build/reference/hpc-design.html docs/build/reference/python-api-design.html 2>/dev/null; sphinx-build -E docs/source docs/build -b html", depends-on = ["polish-rst", "setup-rustdocgen", "gen-c-header"], description = "Build HTML site (org export + C/Rust API + Sphinx)" }
docbld = { cmd = "mkdir -p docs/source/_static && rm -rf docs/build/reference/architecture.html docs/build/reference/benchmarks.html docs/build/reference/hpc-design.html docs/build/reference/python-api-design.html 2>/dev/null; sphinx-build -E docs/source docs/build -b html", depends-on = ["polish-rst", "setup-rustdocgen", "gen-c-header"], description = "Alias of site (readcon-core naming)" }
# Link check on the artifact CI deploys. Requires `lychee` on PATH (cargo install lychee, or CI taiki-e/install-action).
sync-doc-figures = { cmd = "mkdir -p docs/source/_static/figures && cp -u docs/figures/*.svg docs/source/_static/figures/ 2>/dev/null || cp docs/figures/*.svg docs/source/_static/figures/", description = "Copy tracked SVGs into Sphinx _static/figures for embedding" }
polish-rst = { cmd = "python docs/scripts/fix_doc_links.py && python docs/scripts/fix_doxyrest_rst.py", depends-on = ["fix-doc-links", "doxybuild", "gen-rust-api", "sync-doc-figures"], description = "Re-run RST link/role fixes after all generators" }
linkcheck = { cmd = "lychee --config lychee.toml --no-progress 'docs/build/**/*.html' README.md", depends-on = ["site"], description = "Lychee on built HTML (same args as ci_docs.yml)" }

[feature.python.dependencies]
python = ">=3.11"
pip = "*"
compilers = ">=1.8"
pyarrow = ">=14"
pandas = ">=2.2,<3"

[feature.python.pypi-dependencies]
maturin = ">=1.0, <2"
pytest = ">=8"
narwhals = ">=1.0"
polars = ">=1.0"
pydantic = ">=2, <3"

[feature.python.activation.env]
# Same mold / linker hygiene for any cargo-invoking python build steps (maturin).
RUSTFLAGS = ""
PYTHONNOUSERSITE = "1"

[feature.python.tasks]
prepare-python-build = { cmd = "python scripts/prepare_python_build.py" }
build-python = { cmd = "cd rsx-python && PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 maturin develop --release", depends-on = ["prepare-python-build"] }
ensure-python = { cmd = "python -c 'import pyrsx' || bash -lc 'python scripts/prepare_python_build.py && cd rsx-python && PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 maturin develop --release'" }
test-python = { cmd = "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest rsx-python/tests/", depends-on = ["build-python"] }
run-literature-bindings = { cmd = "python benchmarks/run_literature_bindings.py --workdir benchmarks/literature-workdir --results benchmarks/results/literature_binding_results.csv --dataset danio_albolineatus --dataset notothenia_rossii --dataset plecoglossus_altivelis --dataset tinca_tinca --min-depth 10", depends-on = ["ensure-python"] }
analyze-literature-modes = { cmd = "python benchmarks/analyze_literature_modes.py --workdir benchmarks/literature-workdir --results benchmarks/results/literature_mode_effects.csv --dataset danio_albolineatus --dataset notothenia_rossii --dataset plecoglossus_altivelis --dataset tinca_tinca --min-depth 10", depends-on = ["ensure-python"] }

[feature.mpi.dependencies]
mpich = "*"
compilers = ">=1.8"

[feature.mpi.tasks]
build-mpi = { cmd = "MPICC=$CONDA_PREFIX/bin/mpicc CC=$CONDA_PREFIX/bin/mpicc C_INCLUDE_PATH=$CONDA_PREFIX/include LIBRARY_PATH=$CONDA_PREFIX/lib RUSTFLAGS='-C target-cpu=native' cargo build --release --features mpi" }

[feature.cuda]
platforms = ["linux-64"]

[feature.cuda.dependencies]
# cudarc compiles the embedded CUDA C kernel through NVRTC at runtime.
cuda-nvrtc = "12.2.*"

[feature.cuda.activation.env]
RUSTFLAGS = ""
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"

[feature.cuda.tasks]
test-cuda = { cmd = "cargo test -p rsxcore --features cuda --test test_compute_backend && cargo test -p rsxcore --features cuda commands::signif::tests::signif_cuda_matches_cpu_output" }
benchmark-cuda = { cmd = "cargo run --release -p rsxcore --features cuda --example benchmark_compute_backends -- 100000,1000000,10000000,50000000 5" }

[feature.benchmark]
platforms = ["linux-64"]
channels = ["bioconda"]

[feature.benchmark.dependencies]
python = ">=3.11,<3.13"
bc = "*"
cmake = "*"
compilers = ">=1.8"
git = "*"
make = "*"
matplotlib-base = "*"
pandas = ">=2.2,<3"
pkg-config = "*"
plotnine = "*"
sra-tools = "*"
zlib = "*"

[feature.benchmark.pypi-dependencies]
siuba = "*"

[feature.benchmark.tasks]
generate-data = { cmd = "python benchmarks/generate_data.py --outdir benchmarks/data-regenerated", description = "Regenerate synthetic RAD-seq benchmark data into benchmarks/data-regenerated" }
build-rsx = { cmd = "cargo build --release", description = "Build the rsx release binary used by the benchmark harness" }
build-radsex-cpp = { cmd = "bash benchmarks/build_radsex_cpp.sh", description = "Build C++ RADSex for same-input literature comparisons" }
run-benchmarks = { cmd = "bash benchmarks/run_benchmarks.sh", description = "Run the benchmark suite against benchmarks/data", depends-on = ["build-rsx"] }
plot-benchmarks = { cmd = "python benchmarks/plot_benchmarks.py --input benchmarks/results/benchmark_results.csv --output docs/figures", description = "Generate benchmark summary and SVG plots from results CSV" }
check-benchmark-docs = { cmd = "python benchmarks/check_benchmark_docs.py --csv benchmarks/results/benchmark_results.csv --docs docs/orgmode/reference/benchmarks.org", description = "Validate benchmark documentation against the tracked CSV" }
check-literature-manifest = { cmd = "python benchmarks/check_literature_manifest.py --manifest benchmarks/literature_datasets.tsv", description = "Validate the literature-derived benchmark manifest" }
literature-metadata = { cmd = "python benchmarks/run_literature_benchmarks.py --manifest benchmarks/literature_datasets.tsv --metadata-only --results benchmarks/results/literature_benchmark_results.csv --summary docs/figures/literature_benchmark_summary.tsv", description = "Query NCBI metadata for the literature benchmark datasets" }
run-literature-benchmarks = { cmd = "python benchmarks/run_literature_benchmarks.py --manifest benchmarks/literature_datasets.tsv --results benchmarks/results/literature_benchmark_results.csv --summary docs/figures/literature_benchmark_summary.tsv", description = "Download and run the literature-derived benchmark datasets", depends-on = ["build-rsx"] }
run-literature-medaka = { cmd = "python benchmarks/run_literature_benchmarks.py --manifest benchmarks/literature_datasets.tsv --dataset oryzias_latipes --results benchmarks/results/literature_benchmark_results.csv --summary docs/figures/literature_benchmark_summary.tsv", description = "Download and run the public medaka literature benchmark", depends-on = ["build-rsx"] }
analyze-literature-bayes = { cmd = "python benchmarks/analyze_bayesian_evidence.py --workdir benchmarks/literature-workdir --results benchmarks/results/literature_bayesian_evidence.csv", description = "Summarize Bayesian sex-linkage evidence from literature distribution tables" }
analyze-posterior-families = { cmd = "python benchmarks/analyze_posterior_families.py --workdir benchmarks/literature-workdir --profiles benchmarks/posterior_family_profiles.toml --results benchmarks/results/literature_posterior_family_sensitivity.csv --dataset danio_albolineatus --dataset notothenia_rossii --dataset plecoglossus_altivelis --dataset tinca_tinca --min-depths 10", description = "Compare configured posterior families on literature distribution tables" }
summarize-literature-unlocks = { cmd = "python benchmarks/summarize_literature_unlocks.py --workdir benchmarks/literature-workdir --mode-dir benchmarks/literature-workdir/modes --mode-effects benchmarks/results/literature_mode_effects.csv --summary benchmarks/results/literature_bio_unlocks.csv --candidates benchmarks/results/literature_candidate_triage.csv --dataset danio_albolineatus --dataset notothenia_rossii --dataset plecoglossus_altivelis --dataset tinca_tinca --min-depth 10", description = "Summarize marker-level biological gains from literature mode outputs" }
compare-literature-radsex = { cmd = "python benchmarks/compare_literature_radsex.py --workdir benchmarks/literature-workdir --results benchmarks/results/literature_speed_comparison.csv", description = "Run same-input rsx vs C++ RADSex timing comparisons on downloaded literature data", depends-on = ["build-rsx"] }
merge-literature-slurm-results = { cmd = "python benchmarks/merge_literature_results.py --input-dir benchmarks/results/slurm --pattern 'literature_speed_comparison_*.csv' --output benchmarks/results/literature_speed_comparison.csv", description = "Merge Slurm per-dataset literature comparison CSVs" }
merge-literature-binding-slurm-results = { cmd = "python benchmarks/merge_literature_results.py --input-dir benchmarks/results/slurm --pattern 'literature_binding_results_*.csv' --output benchmarks/results/literature_binding_results.csv", description = "Merge Slurm per-dataset Python binding feature CSVs" }
plot-literature-benchmarks = { cmd = "python benchmarks/plot_literature_benchmarks.py --input benchmarks/results/literature_benchmark_results.csv --bayesian benchmarks/results/literature_bayesian_evidence.csv --comparison benchmarks/results/literature_speed_comparison.csv --modes benchmarks/results/literature_mode_effects.csv --unlocks benchmarks/results/literature_bio_unlocks.csv --output docs/figures", description = "Generate paper figures from literature benchmark and Bayesian evidence CSVs" }
package-figshare = { cmd = "bash repro/benchmarks/package_for_figshare.sh", description = "Prepare the benchmark data package for DOI deposition" }
test-package = { cmd = "bash repro/benchmarks/test_package_for_figshare.sh", description = "Validate the benchmark DOI package layout" }

[environments]
default = { features = ["dev"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
benchmark = { features = ["benchmark"], solve-group = "default" }
python = { features = ["python"], solve-group = "default" }
paper = { features = ["benchmark", "python"], solve-group = "default" }
mpi = { features = ["dev", "mpi"], solve-group = "default" }
cuda = { features = ["dev", "cuda"], solve-group = "cuda" }
