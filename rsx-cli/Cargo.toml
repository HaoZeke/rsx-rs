[package]
name = "rsx-cli"
# Kept explicit (not workspace.version) so the binary package can move one
# semver step ahead of the library when crates.io already holds a CLI cut.
version = "0.2.6"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Rust CLI for RAD-seq sex-determination marker analysis (RADSex-compatible)"
repository = "https://github.com/HaoZeke/rsx-rs"

[[bin]]
name = "rsx"
path = "src/main.rs"

[features]
default = ["map"]
map = ["rsxcore/map"]
mpi = ["rsxcore/mpi"]
parquet-io = ["rsxcore/parquet-io"]

[dependencies]
rsxcore = { path = "../rsxcore", version = "0.2.6", features = ["parallel"] }
clap = { version = "4", features = ["derive", "cargo"] }
env_logger = "0.11"
log = "0.4"
