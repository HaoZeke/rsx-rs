[package]
name = "rsx-cli"
# Decoupled from the workspace version for the rsxcore-rename dependent release:
# 0.2.3 is already published against the old radsex-core, so this cut bumps the
# CLI to 0.2.4 depending on the published rsxcore 0.2.3.
version = "0.2.4"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Rust CLI for RAD-seq sex-determination marker analysis (RADSex-compatible)"
repository = "https://github.com/HaoZeke/rsx-rs"

[[bin]]
name = "rsx"
path = "src/main.rs"

[features]
default = ["map"]
map = ["rsxcore/map"]
mpi = ["rsxcore/mpi"]
parquet-io = ["rsxcore/parquet-io"]

[dependencies]
rsxcore = { path = "../rsxcore", version = "0.2.3", features = ["parallel"] }
clap = { version = "4", features = ["derive", "cargo"] }
env_logger = "0.11"
log = "0.4"
