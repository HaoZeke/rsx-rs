# cargo-nextest profile for rsx-rs (see docs in testing audit).
[profile.default]
# Isolation-friendly after per-test tempfile::TempDir migration.
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci]
retries = 1
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 2 }
