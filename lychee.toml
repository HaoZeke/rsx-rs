# Link-checker configuration for lychee.
# Runs in CI over the built docs HTML and the README to catch broken links
# (internal, like a mis-pathed _static asset, and external 404s) before they ship.

# Resilience: retry transient failures and don't fail on rate-limiting or
# bot-blocking from registries/CDNs (those links are valid, just hostile to HEAD).
max_retries = 3
retry_wait_time = 2
timeout = 20
accept = ["200..=206", "403", "429"]

# Pretend to be a browser; some hosts reject the default agent.
user_agent = "Mozilla/5.0 (compatible; lychee; +https://github.com/lycheeverse/lychee)"

exclude = [
  '^mailto:',
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
  # Anti-bot / unstable for automated HEAD; the links themselves are correct.
  '^https://doi\.org/',
  '^https://hdl\.handle\.net/',
  '^https://www\.gnu\.org/',
  # Ecosystem cross-links to the companion R packages. These return 404 to an
  # unauthenticated checker while the RuhiRG repositories are private; remove
  # these excludes once they are public (required for rOpenSci/CRAN anyway).
  '^https://github\.com/RuhiRG/ChromSex',
  '^https://github\.com/RuhiRG/SexPCR',
  # Edit-this-page / view-source targets main RST under docs/source/, which is
  # generated from docs/orgmode/ and gitignored (same pattern as LODE readcon-core
  # excluding blob links during CI). Canonical narrative is docs/orgmode/.
  '^https://github\.com/HaoZeke/rsx-rs/blob/',
  # Live site lags deploy; CI checks local HTML. Remote may 404 for new pages.
  '^https://rsx\.rgoswami\.me/',
  # Theme / analytics vendor (Shibuya / TurtleTech antics); not content links.
  '^https?://antics-api\.turtletech\.us/',
  '^https?://analytics\.turtletech\.us/',
  '^https?://umami\.is/?$',
  '^https?://fonts\.gstatic\.com/',
  '^https?://fonts\.googleapis\.com/',
  # Badge CDN flaky under automated HEAD (timeouts ≠ broken badges).
  '^https://img\.shields\.io/',
]

# Theme / vendor noise (not content links)
exclude_path = [
  "docs/build/_static/.*",
  "docs/build/searchindex.js",
]
