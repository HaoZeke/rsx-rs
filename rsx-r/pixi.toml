[workspace]
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
channels = ["conda-forge"]
name = "rsxr"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Isolated CARGO_HOME avoids host ~/.cargo/config.toml (e.g. mold + clang)
# clashing with conda-forge's x86_64-conda-linux-gnu-cc, which rejects -fuse-ld=mold.
document = "env CARGO_HOME=\"$PWD/.pixi/cargo-home\" Rscript --no-init-file -e 'roxygen2::roxygenise()'"
install = "env CARGO_HOME=\"$PWD/.pixi/cargo-home\" R CMD INSTALL --preclean --no-multiarch ."
check = "env CARGO_HOME=\"$PWD/.pixi/cargo-home\" Rscript --no-init-file -e 'rcmdcheck::rcmdcheck(args = c(\"--no-manual\"), error_on = \"warning\")'"
test = "env CARGO_HOME=\"$PWD/.pixi/cargo-home\" Rscript --no-init-file -e 'devtools::test()'"
vendor = "sh tools/vendor.sh"
# Structural gate for the monorepo pkgcheck Actions contract (no R required).
test-pkgcheck-workflow = "sh tools/test_pkgcheck_workflow.sh"

[dependencies]
r-base = ">=4.3"
r-devtools = ">=2.4"
r-roxygen2 = "*"
r-rcmdcheck = "*"
r-testthat = ">=3.0"
r-tibble = "*"
r-readr = "*"
rust = ">=1.85"
# Compression libraries needletail links against (also pulled by the linker).
zlib = "*"
bzip2 = "*"
xz = "*"
