[package]
name = "rsxr"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Static-library anchor exposing the rsxcore C API to the rsxr R package"
license = "GPL-3.0-or-later"

# Standalone workspace so the R-package build is not captured by the outer
# rsx-rs cargo workspace when invoked through src/Makevars.
[workspace]

[lib]
name = "rsxr"
crate-type = ["staticlib"]

[profile.release]
# Keep the C-API symbols; they are reached only through the #[used] anchor.
lto = false
opt-level = 3

[dependencies]
# Package-local path (src/rust/rsxcore). configure / CI stage the monorepo
# rsxcore tree here so R CMD build's isolated temp dir still compiles. The
# crate's library name is `rsx_core` (Rust `use rsx_core`); package dir is
# `rsxcore`. CRAN packaging (tools/vendor.sh) can rewrite this to crates.io.
rsxcore = { path = "rsxcore", default-features = false, features = ["parallel"] }
