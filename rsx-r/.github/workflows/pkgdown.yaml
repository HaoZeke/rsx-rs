# Build and deploy the pkgdown documentation site.
# rsxr compiles the rsxcore Rust static library, so the runner needs cargo and
# the compression system libraries before the package can be installed.
on:
  push:
    branches: [main]
    paths: ["rsx-r/**", "rsxcore/**"]
  workflow_dispatch:

name: rsxr-pkgdown

permissions:
  contents: write

defaults:
  run:
    working-directory: rsx-r

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libbz2-dev liblzma-dev
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
          working-directory: rsx-r
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: rsx-r/docs
