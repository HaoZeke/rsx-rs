# R CMD check for the rsxr package (rsx-r/). Needs cargo + rsxcore at ../rsxcore.
name: rsxr-R-CMD-check

on:
  push:
    branches: [main]
    paths:
      - "rsx-r/**"
      - "rsxcore/**"
      - ".github/workflows/rsxr-R-CMD-check.yaml"
  pull_request:
    branches: [main]
    paths:
      - "rsx-r/**"
      - "rsxcore/**"
      - ".github/workflows/rsxr-R-CMD-check.yaml"

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          # Ubuntu is the supported monorepo CI surface for Rust+R linking.
          # macOS/Windows EXTRA_LIBS are wired in configure; enable when green.
          - { os: ubuntu-latest,  r: "release" }
          - { os: ubuntu-latest,  r: "devel" }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      # R CMD build isolates rsx-r/; stage + de-workspace rsxcore for the path dep.
      - name: Stage rsxcore into rsx-r/src/rust/rsxcore
        run: sh rsx-r/tools/stage_rsxcore.sh rsx-r

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: dtolnay/rust-toolchain@stable

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libbz2-dev liblzma-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: rsx-r

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: rsx-r
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
