name: Build and Deploy Documentation
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: false
          environments: docs
          locked: false

      # emacs also in pixi docs env; setup-emacs is belt-and-braces for ox-rst MELPA on first run
      - uses: purcell/setup-emacs@master
        with:
          version: 30.1

      - name: Build documentation site
        # Single entry point — same as local `pixi run -e docs site` / `docbld`
        # (mkrst → fix-doc-links → rust/C API gens → sphinx-build).
        run: pixi run -e docs site

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/build

      - name: Install lychee
        uses: taiki-e/install-action@v2
        with:
          tool: lychee@0.24.2

      - name: Check links (lychee)
        # Same command as `pixi run -e docs linkcheck` (minus the site depends-on,
        # because site already ran above). Fail the job on broken links.
        run: lychee --config lychee.toml --no-progress 'docs/build/**/*.html' README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Cloudflare Pages project exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 pages project create rsx --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/build --project-name=rsx --branch=main
