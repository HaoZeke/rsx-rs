# rOpenSci pkgcheck for rsxr (rsx-r/). Custom job: stages rsxcore + Rust so the
# monorepo package can compile; does NOT use the stock Docker pkgcheck-action
# alone (no package-subdir / cargo contract).
#
# Known limitation: pkgcheck's "GitHub CI green" assertion can lag while sibling
# workflows (R-CMD-check matrix, docs) are still running. Prefer package checks;
# do not invent a wait loop on other Actions jobs.
name: rsxr-pkgcheck

on:
  push:
    branches: [main]
    paths:
      - "rsx-r/**"
      - "rsxcore/**"
      - ".github/workflows/rsxr-pkgcheck.yaml"
  pull_request:
    branches: [main]
    paths:
      - "rsx-r/**"
      - "rsxcore/**"
      - ".github/workflows/rsxr-pkgcheck.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Stage rsxcore into rsx-r/src/rust/rsxcore
        run: sh rsx-r/tools/stage_rsxcore.sh rsx-r

      - uses: dtolnay/rust-toolchain@stable

      - name: System libraries
        run: |
          sudo apt-get update
          # zlib/bz2/xz for rsxcore; libxml2 for igraph; checkbashisms; TeX for Rd PDF
          # (minimal TeX lacks Rd packages → ERROR on "PDF version of manual")
          sudo apt-get install -y zlib1g-dev libbz2-dev liblzma-dev libxml2-dev \
            devscripts texlive-latex-base texlive-fonts-recommended \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-extra \
            lmodern

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Package deps + install rsxr (local::.). pkgcheck is GitHub-only (not CRAN).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check
          working-directory: rsx-r

      - name: Install pkgcheck from GitHub
        run: |
          Rscript --no-init-file -e '
            if (!requireNamespace("pak", quietly = TRUE)) {
              install.packages("pak", repos = sprintf(
                "https://r-lib.github.io/p/pak/stable/%s/%s/%s",
                .Platform$pkgType, R.Version()$os, R.Version()$arch
              ))
            }
            # Full dependency tree (hard + soft) — pkgcheck loads visNetwork etc. at runtime.
            pak::pak(
              "ropensci-review-tools/pkgcheck",
              dependencies = TRUE
            )
            # Explicit soft deps that pkgcheck may loadNamespace without Suggests install.
            pak::pak(c("visNetwork", "igraph", "goodpractice", "jsonlite", "gh", "curl"))
            stopifnot(requireNamespace("pkgcheck", quietly = TRUE))
            stopifnot(requireNamespace("visNetwork", quietly = TRUE))
          '

      - name: Run pkgcheck (fail on non-clean checklist)
        working-directory: rsx-r
        run: |
          Rscript --no-init-file -e '
            res <- pkgcheck::pkgcheck()
            s <- summary(res)
            print(s)
            # Surface embedded R CMD check / goodpractice details in Actions logs.
            if (!is.null(res$checks$rcmdcheck)) {
              message("---- embedded rcmdcheck (pkgcheck) ----")
              try(print(res$checks$rcmdcheck), silent = TRUE)
            }
            if (!is.null(res$goodpractice)) {
              message("---- goodpractice rcmdcheck errors/warnings ----")
              gp <- res$goodpractice
              if (!is.null(gp$rcmdcheck)) try(print(gp$rcmdcheck), silent = TRUE)
            }
            ok <- isTRUE(attr(s, "checks_okay"))
            if (!isTRUE(ok) && "checks_okay" %in% getNamespaceExports("pkgcheck")) {
              ok <- isTRUE(pkgcheck::checks_okay(res))
            }
            if (!isTRUE(ok)) {
              stop("pkgcheck: package is not ready (see checklist above)", call. = FALSE)
            }
            message("pkgcheck: checks_okay")
          '
